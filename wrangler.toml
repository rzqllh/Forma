name = "forma-api"
main = "workers/api/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "forma-db"
database_id = "forma-db-production"
migrations_dir = "db/migrations"

# Daily Scheduled Purge Cron Trigger (runs daily at 03:00 UTC)
[triggers]
crons = ["0 3 * * *"]

# Static site output for Cloudflare Pages
[pages]
pages_build_output_dir = "out"
